name: CI Build and Deploy

on:
  push:
    branches:
      - main
      - master
      - aicodex
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DOPPLER_PROJECT: todolist
      DOPPLER_CONFIG: prd

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Doppler CLI
        run: curl -Ls https://cli.doppler.com/install.sh | sudo sh

      - name: Download env vars from Doppler
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          if [ -z "$DOPPLER_TOKEN" ]; then
            echo "DOPPLER_TOKEN is not set" >&2
            exit 1
          fi
          doppler secrets download \
            --token "$DOPPLER_TOKEN" \
            --project "$DOPPLER_PROJECT" \
            --config "$DOPPLER_CONFIG" \
            --no-file \
            --format env > .env

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build project
        run: pnpm build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: todolist-build
          if-no-files-found: error
          path: |
            dist
            .env

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/aicodex'
    env:
      DEPLOY_HOST: 45.130.212.122
      DEPLOY_USER: root
      DEPLOY_PATH: /var/www/todolist

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: todolist-build
          path: build-output

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "DEPLOY_SSH_KEY secret is missing" >&2
            exit 1
          fi
          install -m 600 /dev/null ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Deploy to server
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$DEPLOY_PATH/dist'"
          rsync -az --delete build-output/dist/ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/dist/"
          scp build-output/.env "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/.env"
