name: Deploy SPA to VPS

on:
  push:
    branches:
      - dev
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests if present
        run: |
          TEST_SCRIPT=$(node -e "const pkg=require('./package.json'); if(pkg.scripts?.['test:run']){console.log('test:run');} else if(pkg.scripts?.test){console.log('test');}")
          if [ -n "$TEST_SCRIPT" ]; then
            echo "Running tests: $TEST_SCRIPT"
            pnpm run "$TEST_SCRIPT"
          else
            echo "No tests configured, skipping."
          fi

      - name: Build
        run: pnpm run build

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p "${{ secrets.VPS_PORT }}" -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy via rsync
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
          BUILD_DIR: dist
        run: |
          echo "Build folder: $BUILD_DIR"
          echo "Deploy path: $VPS_PATH"
          ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "mkdir -p '$VPS_PATH'"
          rsync --archive --compress --delete --human-readable --itemize-changes \
            -e "ssh -p $VPS_PORT" \
            "$BUILD_DIR"/ "$VPS_USER@$VPS_HOST:$VPS_PATH"/
