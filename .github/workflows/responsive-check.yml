name: Responsive UI Checks

on:
  push:
    branches:
      - dev
      - main
  pull_request:

jobs:
  responsive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build app
        run: pnpm run build

      - name: Install Playwright browsers
        run: PLAYWRIGHT_BROWSERS_PATH=.playwright pnpm exec playwright install --with-deps chromium

      - name: Run responsive smoke tests
        run: pnpm run test:responsive

      - name: Run Lighthouse reports
        run: pnpm run lighthouse

      - name: Upload responsive screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-screenshots
          path: artifacts/responsive
          if-no-files-found: warn

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: artifacts/playwright-report
          if-no-files-found: warn

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: artifacts/lighthouse
          if-no-files-found: warn
